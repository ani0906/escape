<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>羽翼下的抉擇：鏡中真相</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #030305;
      color: #e5e5e5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* 驚悚主標題 */
    .horror-title {
      font-family: 'Creepster', 'Noto Serif TC', serif;
      color: #dc2626;
      text-shadow: 0 0 20px rgba(220, 38, 38, 0.9), 0 0 40px rgba(185, 28, 28, 0.6), 2px 2px 8px #000;
      letter-spacing: 4px;
      font-size: 3.2rem;
    }

    .game-viewport {
      width: 100vw;
      height: 100vh;
      max-width: 920px;
      max-height: 690px;
      background: #07070a;
      border: 2px solid #2a1212;
      box-shadow: 0 0 60px rgba(185, 28, 28, 0.25), inset 0 0 80px rgba(0, 0, 0, 0.9);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border-radius: 8px;
    }

    /* 暗角與電影底片紋理遮罩 */
    .vignette {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle, transparent 35%, rgba(2, 2, 4, 0.88) 85%, rgba(0, 0, 0, 0.98) 100%);
      pointer-events: none;
      z-index: 10;
    }

    .noise-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.28) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 11;
      opacity: 0.55;
    }

    /* 微粒子 Canvas 繪製背景大氣霧氣與塵埃 */
    #ambientCanvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    /* 場景容器 */
    .scene {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: none;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .scene.active {
      display: block;
      opacity: 1;
      pointer-events: auto;
    }

    /* 鏽湖風格古典銅質感切換箭頭 */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 54px;
      height: 76px;
      background: rgba(10, 8, 8, 0.65);
      border: 1px solid rgba(217, 119, 6, 0.3);
      color: #d97706;
      font-size: 2.2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 20;
      transition: all 0.3s ease;
      border-radius: 8px;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }

    .nav-arrow:hover {
      background: rgba(185, 28, 28, 0.75);
      color: #fff;
      border-color: #f87171;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.8);
      transform: translateY(-50%) scale(1.08);
    }

    .nav-arrow.left { left: 18px; }
    .nav-arrow.right { right: 18px; }

    /* --- 開始畫面 --- */
    #startScene {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      background: radial-gradient(circle, #200a0a 0%, #080303 100%);
      z-index: 15;
    }

    #startScene h1 {
      margin-bottom: 45px;
    }

    .start-btn {
      background: linear-gradient(180deg, #581c1c 0%, #320a0a 100%);
      color: #fca5a5;
      border: 1px solid #b91c1c;
      padding: 16px 48px;
      font-size: 1.25rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: 6px;
      box-shadow: 0 0 20px rgba(185, 28, 28, 0.4), inset 0 1px 1px rgba(255,255,255,0.2);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 20;
      text-decoration: none;
      display: inline-block;
      letter-spacing: 2px;
    }

    .start-btn:hover {
      background: linear-gradient(180deg, #991b1b 0%, #581c1c 100%);
      color: #fff;
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.9), inset 0 1px 1px rgba(255,255,255,0.4);
      transform: translateY(-2px) scale(1.04);
    }

    /* SVG 背景圖形層 */
    .svg-background {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* 項圈閃爍脈沖提示點 */
    .glowing-collar {
      position: absolute;
      top: 45.5%;
      left: 49.1%;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(251, 191, 36, 0.35);
      border: 2px solid #fbbf24;
      box-shadow: 0 0 18px #fbbf24, inset 0 0 10px #f59e0b;
      animation: pulseGlow 1.8s infinite ease-in-out;
      cursor: pointer;
      z-index: 15;
    }

    @keyframes pulseGlow {
      0%, 100% {
        transform: scale(0.92);
        opacity: 0.6;
        box-shadow: 0 0 10px #fbbf24;
      }
      50% {
        transform: scale(1.3);
        opacity: 1;
        box-shadow: 0 0 28px #f59e0b, 0 0 45px #d97706;
      }
    }

    /* 去背純 SVG 發光黃金鑰匙 */
    .key-item-pure {
      position: absolute;
      top: 61%;
      left: 48.5%;
      width: 52px;
      height: 52px;
      cursor: pointer;
      z-index: 18;
      display: none;
      filter: drop-shadow(0 0 12px #fbbf24) drop-shadow(0 0 25px #f59e0b);
      animation: keyPulse 1.6s infinite ease-in-out;
    }

    @keyframes keyPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px #fbbf24); }
      50% { transform: scale(1.18); filter: drop-shadow(0 0 22px #fef08a) drop-shadow(0 0 35px #f59e0b); }
    }

    /* --- 密碼鎖 Modal（復古哥德式精緻金屬盤） --- */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(4, 4, 6, 0.93);
      backdrop-filter: blur(10px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 30;
    }

    .modal-overlay.active {
      display: flex;
    }

    .lock-card {
      background: linear-gradient(145deg, #1f1d24 0%, #0e0d11 100%);
      border: 2px solid #4a3e3d;
      border-radius: 20px;
      padding: 40px 30px 30px 30px;
      width: 340px;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.95), 0 0 20px rgba(185, 28, 28, 0.35);
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 16px;
      background: none;
      border: none;
      color: #8b8589;
      font-size: 1.8rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    .close-btn:hover { color: #f87171; }

    .dials-container {
      display: flex;
      justify-content: center;
      gap: 22px;
      margin-top: 10px;
    }

    .dial-group {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .dial-btn {
      background: linear-gradient(180deg, #322d37 0%, #1c1921 100%);
      border: 1px solid #5a4f5c;
      color: #e4e4e7;
      width: 48px;
      height: 36px;
      font-size: 1.1rem;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .dial-btn:hover {
      background: #4a3e50;
      color: #fff;
      border-color: #93819a;
    }

    .dial-display {
      width: 62px;
      height: 72px;
      background: #060508;
      border-radius: 10px;
      margin: 10px 0;
      font-size: 2.6rem;
      font-family: 'Creepster', cursive;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.9);
      font-weight: bold;
    }

    /* 紅色寶石框格 */
    .dial-red {
      border: 2px solid #ef4444;
      color: #f87171;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.9), 0 0 16px rgba(239, 68, 68, 0.5);
    }

    /* 黃色寶石框格 */
    .dial-yellow {
      border: 2px solid #eab308;
      color: #facc15;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.9), 0 0 16px rgba(234, 179, 8, 0.5);
    }

    /* 藍色寶石框格 */
    .dial-blue {
      border: 2px solid #3b82f6;
      color: #60a5fa;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.9), 0 0 16px rgba(59, 130, 246, 0.5);
    }

    /* --- 場景：古老橢圓鏡與魔幻靈魂倒影 --- */
    #mirrorScene {
      background: #030304;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .mirror-frame {
      width: 300px;
      height: 400px;
      border: 14px solid #1c1917;
      border-radius: 150px 150px 30px 30px;
      background: radial-gradient(circle, #26201e 0%, #0a0808 100%);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.95), inset 0 0 30px rgba(0, 0, 0, 0.95), 0 0 15px rgba(217, 119, 6, 0.15);
      position: relative;
      overflow: hidden;
      margin-bottom: 26px;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .mirror-frame:hover {
      transform: scale(1.02);
    }

    .mirror-glass {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .owl-reflection {
      width: 250px;
      height: 250px;
      opacity: 0;
      filter: blur(8px) grayscale(30%);
      transition: opacity 2.8s cubic-bezier(0.4, 0, 0.2, 1), filter 2.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .owl-reflection.revealed {
      opacity: 0.98;
      filter: blur(0px) drop-shadow(0 0 20px rgba(245, 158, 11, 0.7));
    }

    .crack-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      opacity: 0.65;
    }

    .story-text {
      max-width: 580px;
      text-align: center;
      font-size: 1.15rem;
      line-height: 1.95;
      color: #e4e4e7;
      min-height: 80px;
      padding: 0 20px;
    }

    .story-text span.highlight {
      color: #fbbf24;
      font-weight: bold;
      font-size: 1.35rem;
      text-shadow: 0 0 8px rgba(251, 191, 36, 0.4);
    }
  </style>
</head>
<body>

  <div class="game-viewport">
    <div class="vignette"></div>
    <div class="noise-overlay"></div>
    <canvas id="ambientCanvas"></canvas>

    <!-- ===== 1. 開始畫面 (純極簡僅留標題與按鈕) ===== -->
    <div id="startScene" class="scene active" style="display: flex;">
      <h1 class="horror-title">羽翼下的抉擇：鏡中真相</h1>
      <button class="start-btn" onclick="initGame()">進入荒野</button>
    </div>

    <!-- ===== 2. 左邊場景：八隻繪製精緻、自然散落的藍色死老鼠 ===== -->
    <div id="leftScene" class="scene">
      <div class="nav-arrow right" onclick="switchScene('mainScene')">❯</div>
      <svg class="svg-background" viewBox="0 0 800 600" preserveAspectRatio="none">
        <defs>
          <radialGradient id="nightGlowLeft" cx="50%" cy="80%" r="70%">
            <stop offset="0%" stop-color="#0f172a"/>
            <stop offset="100%" stop-color="#020305"/>
          </radialGradient>
          
          <filter id="ratGlow">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3b82f6" flood-opacity="0.3"/>
          </filter>
        </defs>

        <rect width="800" height="600" fill="url(#nightGlowLeft)"/>
        
        <!-- 地表地形丘陵 -->
        <path d="M 0 430 Q 250 390 500 440 T 800 410 L 800 600 L 0 600 Z" fill="#090d16"/>
        <path d="M 0 490 Q 350 460 800 510 L 800 600 L 0 600 Z" fill="#04060a"/>

        <!-- 枯乾白芒草殘影層 -->
        <g stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" opacity="0.6">
          <path d="M 40 600 Q 60 480 110 390 M 50 600 Q 80 470 130 380"/>
          <path d="M 170 600 Q 200 450 240 370 M 185 600 Q 220 440 270 360"/>
          <path d="M 580 600 Q 620 460 680 380 M 600 600 Q 640 450 710 370"/>
        </g>

        <!-- 8 隻精細藍色死老鼠 (姿態各異、自然散落、具備立體細節與側光) -->
        <g id="deadRatsGroup" filter="url(#ratGlow)">
          <!-- 老鼠 1：左前側身俯臥 -->
          <g transform="translate(130, 520) rotate(55) scale(0.95)">
            <ellipse cx="0" cy="0" rx="22" ry="11" fill="#2563eb"/>
            <circle cx="-18" cy="-2" r="7" fill="#1d4ed8"/>
            <circle cx="-21" cy="-4" r="3" fill="#1e40af"/> <!-- 耳朵 -->
            <path d="M 19 0 Q 32 -6 38 6" stroke="#3b82f6" stroke-width="2.5" fill="none"/>
            <line x1="-12" y1="9" x2="-8" y2="16" stroke="#1e3a8a" stroke-width="2.5"/>
            <line x1="10" y1="9" x2="14" y2="16" stroke="#1e3a8a" stroke-width="2.5"/>
            <text x="-6" y="3" fill="#93c5fd" font-size="9" font-weight="bold">x x</text>
          </g>

          <!-- 老鼠 2：倒掛在後方草根 -->
          <g transform="translate(220, 465) rotate(-115) scale(0.8)">
            <ellipse cx="0" cy="0" rx="20" ry="10" fill="#1d4ed8"/>
            <circle cx="-16" cy="-2" r="6" fill="#1e40af"/>
            <circle cx="-19" cy="-4" r="2.5" fill="#172554"/>
            <path d="M 18 0 Q 30 6 36 -3" stroke="#60a5fa" stroke-width="2" fill="none"/>
            <text x="-5" y="3" fill="#93c5fd" font-size="8" font-weight="bold">x x</text>
          </g>

          <!-- 老鼠 3：中央近景仰躺四腳朝天 -->
          <g transform="translate(320, 545) rotate(170) scale(1.1)">
            <ellipse cx="0" cy="0" rx="24" ry="12" fill="#2563eb"/>
            <circle cx="-20" cy="-2" r="8" fill="#1d4ed8"/>
            <circle cx="-23" cy="-5" r="3.5" fill="#1e40af"/>
            <path d="M 20 0 Q 28 10 35 3" stroke="#60a5fa" stroke-width="2.5" fill="none"/>
            <line x1="-12" y1="-8" x2="-8" y2="-17" stroke="#1d4ed8" stroke-width="2.5"/>
            <line x1="8" y1="-8" x2="12" y2="-17" stroke="#1d4ed8" stroke-width="2.5"/>
            <text x="-6" y="3" fill="#bfdbfe" font-size="10" font-weight="bold">x x</text>
          </g>

          <!-- 老鼠 4：中後側臥屈體 -->
          <g transform="translate(410, 480) rotate(-20) scale(0.85)">
            <ellipse cx="0" cy="0" rx="21" ry="10" fill="#1d4ed8"/>
            <circle cx="-17" cy="-2" r="6.5" fill="#1e40af"/>
            <path d="M 18 0 Q 28 -10 34 -2" stroke="#3b82f6" stroke-width="2" fill="none"/>
            <text x="-5" y="3" fill="#60a5fa" font-size="8" font-weight="bold">x x</text>
          </g>

          <!-- 老鼠 5：中右側斜向死僵 -->
          <g transform="translate(495, 520) rotate(125) scale(0.9)">
            <ellipse cx="0" cy="0" rx="22" ry="11" fill="#2563eb"/>
            <circle cx="-18" cy="-2" r="7" fill="#1d4ed8"/>
            <path d="M 19 0 Q 28 6 36 0" stroke="#60a5fa" stroke-width="2" fill="none"/>
            <text x="-5" y="3" fill="#93c5fd" font-size="9" font-weight="bold">x x</text>
          </g>

          <!-- 老鼠 6：右後小隻隱沒於暗處 -->
          <g transform="translate(585, 470) rotate(-80) scale(0.75)">
            <ellipse cx="0" cy="0" rx="20" ry="9" fill="#1d4ed8"/>
            <circle cx="-16" cy="-2" r="6" fill="#1e40af"/>
            <path d="M 17 0 Q 25 -10 32 -3" stroke="#3b82f6" stroke-width="2" fill="none"/>
            <text x="-5" y="3" fill="#60a5fa" font-size="8" font-weight="bold">x x</text>
          </g>

          <!-- 老鼠 7：右前巨大伏倒 -->
          <g transform="translate(670, 540) rotate(22) scale(1.05)">
            <ellipse cx="0" cy="0" rx="24" ry="12" fill="#2563eb"/>
            <circle cx="-20" cy="-2" r="8" fill="#1d4ed8"/>
            <circle cx="-23" cy="-5" r="3.5" fill="#1e40af"/>
            <path d="M 21 0 Q 32 8 40 2" stroke="#60a5fa" stroke-width="2.5" fill="none"/>
            <text x="-6" y="3" fill="#bfdbfe" font-size="10" font-weight="bold">x x</text>
          </g>

          <!-- 老鼠 8：最右側邊緣蜷曲 -->
          <g transform="translate(740, 500) rotate(-138) scale(0.85)">
            <ellipse cx="0" cy="0" rx="21" ry="10" fill="#1d4ed8"/>
            <circle cx="-17" cy="-2" r="6.5" fill="#1e40af"/>
            <path d="M 18 0 Q 28 -5 34 6" stroke="#3b82f6" stroke-width="2" fill="none"/>
            <text x="-5" y="3" fill="#60a5fa" font-size="8" font-weight="bold">x x</text>
          </g>
        </g>
      </svg>
    </div>

    <!-- ===== 3. 主畫面（中間）：草叢荒野、狗雕像、縮小版暗紅草鴞剪影 ===== -->
    <div id="mainScene" class="scene">
      <div class="nav-arrow left" onclick="switchScene('leftScene')">❮</div>
      <div class="nav-arrow right" onclick="switchScene('rightScene')">❯</div>

      <svg class="svg-background" viewBox="0 0 800 600" preserveAspectRatio="none">
        <defs>
          <linearGradient id="skyGradMain" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#04060c"/>
            <stop offset="60%" stop-color="#0c1220"/>
            <stop offset="100%" stop-color="#172033"/>
          </linearGradient>

          <!-- 雕像質感陰影 filter -->
          <filter id="statueShadow">
            <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.9"/>
          </filter>

          <!-- 神祕草鴞紅色發光 filter -->
          <filter id="owlAura">
            <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.8"/>
          </filter>
        </defs>

        <!-- 夜空與明月 -->
        <rect width="800" height="600" fill="url(#skyGradMain)"/>
        <circle cx="680" cy="110" r="50" fill="#fef3c7" opacity="0.1"/>
        <circle cx="680" cy="110" r="38" fill="#fffbeb" opacity="0.8"/>

        <!-- 遠景層次山丘剪影 -->
        <path d="M 0 410 Q 220 330 450 390 T 800 360 L 800 600 L 0 600 Z" fill="#0d1424"/>

        <!-- 背景：1 隻縮小版、極具線條韻味與心形面盤細節的紅色草鴞剪影 -->
        <g transform="translate(270, 225) scale(0.38)" opacity="0.85" filter="url(#owlAura)">
          <!-- 主羽翼體軀 -->
          <path d="M 100 30 C 50 30, 30 75, 30 145 C 30 215, 75 245, 100 245 C 125 245, 170 215, 170 145 C 170 75, 150 30, 100 30 Z" fill="#7f1d1d"/>
          <!-- 標誌性草鴞心形面盤 -->
          <path d="M 100 65 C 75 45, 48 68, 48 118 C 48 168, 82 195, 100 212 C 118 195, 152 168, 152 118 C 152 68, 125 45, 100 65 Z" fill="#b91c1c"/>
          <!-- 雙眼發光紅點 -->
          <circle cx="76" cy="118" r="8" fill="#fca5a5"/>
          <circle cx="124" cy="118" r="8" fill="#fca5a5"/>
          <circle cx="76" cy="118" r="4" fill="#ef4444"/>
          <circle cx="124" cy="118" r="4" fill="#ef4444"/>
          <!-- 展開羽翼展翅剪影 -->
          <path d="M 38 135 C 0 115, -50 155, -95 220 C -40 205, 15 185, 35 165 Z" fill="#450a0a"/>
          <path d="M 162 135 C 200 115, 250 155, 295 220 C 240 205, 185 185, 165 165 Z" fill="#450a0a"/>
        </g>

        <!-- 白芒草叢 (中景) -->
        <g stroke="#334155" stroke-width="2.5" stroke-linecap="round" opacity="0.75">
          <path d="M 40 600 Q 60 440 120 360 M 55 600 Q 90 430 145 350"/>
          <path d="M 190 600 Q 215 450 260 370 M 205 600 Q 235 420 290 360"/>
          <path d="M 540 600 Q 565 440 615 350 M 560 600 Q 595 430 650 360"/>
          <path d="M 690 600 Q 715 460 765 380"/>
        </g>

        <!-- 刻畫細緻的石狗雕像 (完整狀態) -->
        <g id="dogStatueFull" filter="url(#statueShadow)">
          <!-- 基座 -->
          <rect x="330" y="415" width="140" height="45" fill="#1e293b" rx="5"/>
          <rect x="320" y="450" width="160" height="25" fill="#0f172a" rx="3"/>
          <!-- 獵犬主體與雕紋細節 -->

    <!-- ===== 4. 右邊場景：高樓大廈與恰好 5 個黃色發光窗口 ===== -->
    <div id="rightScene" class="scene">
      <div class="nav-arrow left" onclick="switchScene('mainScene')">❮</div>
      <svg class="svg-background" viewBox="0 0 800 600" preserveAspectRatio="none">
        <defs>

        <rect width="800" height="600" fill="url(#citySky)"/>

        <!-- 遠景建築剪影群 -->
        <rect x="30" y="220" width="110" height="380" fill="#06080e"/>
        <rect x="120" y="150" width="130" height="450" fill="#0a0d16"/>

        <!-- 恰好 5 個黃色發光窗口 (線索數字：5) -->
        <g fill="#facc15" filter="url(#windowGlow)">

        <!-- 其他無發光黑窗（豐富細節） -->
        <g fill="#1a202c" opacity="0.4">
          <rect x="60" y="260" width="22" height="32"/>

    <!-- ===== 5. 密碼鎖 Modal（無字純極簡，紅黃藍 158） ===== -->
    <div id="lockModal" class="modal-overlay">
      <div class="lock-card">
        <button class="close-btn" onclick="closeLockModal()">&times;</button>

        <div class="dials-container">
          <!-- 紅色數字格 (對應 1 隻紅草鴞) -->
          <div class="dial-group">
            <button class="dial-btn" onclick="changeDigit(0, 1)">▲</button>
            <div id="digit0" class="dial-display dial-red">0</div>
            <button class="dial-btn" onclick="changeDigit(0, -1)">▼</button>
          </div>
          <!-- 黃色數字格 (對應 5 個黃窗口) -->
          <div class="dial-group">
            <button class="dial-btn" onclick="changeDigit(1, 1)">▲</button>
            <div id="digit1" class="dial-display dial-yellow">0</div>
            <button class="dial-btn" onclick="changeDigit(1, -1)">▼</button>

          <!-- 藍色數字格 (對應 8 隻藍死鼠) -->

    <!-- ===== 6. 場景：鏡子畫面（完全無字） ===== -->
    <div id="mirrorScene" class="scene">
      <div class="mirror-frame" onclick="triggerMirrorReveal()">
        <div class="mirror-glass">
          <!-- 精細草鴞倒影 SVG (富含細節特徵) -->
          <svg id="owlSvg" class="owl-reflection" viewBox="0 0 200 200">
            <!-- 身體與斑紋羽毛 -->
            <path d="M 100 25 C 55 25, 25 65, 25 110 C 25 155, 65 185, 100 185 C 135 185, 175 155, 175 110 C 175 65, 145 25, 100 25 Z" fill="#d97706" opacity="0.85"/>
            <!-- 草鴞著名心形面具面盤 -->
            <path d="M 100 48 C 78 32, 45 55, 45 95 C 45 135, 82 160, 100 172 C 118 160, 155 135, 155 95 C 155 55, 122 32, 100 48 Z" fill="#fef3c7"/>
            <!-- 左眼 -->
            <circle cx="73" cy="92" r="15" fill="#000"/>
            <circle cx="73" cy="92" r="13" fill="#b45309"/>
            <circle cx="73" cy="92" r="6" fill="#000"/>
            <circle cx="70" cy="88" r="2.5" fill="#fff"/>
            <!-- 右眼 -->
            <circle cx="127" cy="92" r="15" fill="#000"/>
            <circle cx="127" cy="92" r="13" fill="#b45309"/>
            <circle cx="127" cy="92" r="6" fill="#000"/>
            <circle cx="124" cy="88" r="2.5" fill="#fff"/>

            <polygon points="100,102 93,124 107,124" fill="#78350f"/>
          </svg>

          <!-- 鏡面裂痕 overlay -->
          <svg class="crack-overlay" viewBox="0 0 200 300">
            <path d="M 20 0 L 80 120 L 140 180 M 80 120 L 40 220 M 140 180 L 190 280" stroke="rgba(255,255,255,0.4)" stroke-width="1.8" fill="none"/>
          </svg>
        </div>
      </div>

      <div class="story-text" id="storyText"></div>

      <!-- 公視新聞連結按鈕 -->
      <a id="ptsNewsLink" href="https://news.pts.org.tw/article/753895" target="_blank" rel="noopener noreferrer" class="start-btn" style="display:none; margin-top: 24px; font-size: 1.05rem; padding: 12px 28px;">
        📰 閱讀公視專題：草鴞的生存危機與滅絕威脅
      </a>
    </div>

  </div>

  <script>
    // 背景大氣閃爍塵埃與霧氣 Canvas 動畫
    const canvas = document.getElementById('ambientCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.5;
        this.speedX = Math.random() * 0.4 - 0.2;
        this.speedY = -Math.random() * 0.3 - 0.1;
        this.opacity = Math.random() * 0.5 + 0.1;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.y < 0 || this.x < 0 || this.x > canvas.width) {
          this.reset();
          this.y = canvas.height;
        }
      }
      draw() {
        ctx.fillStyle = `rgba(250, 204, 21, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 40; i++) {
      particles.push(new Particle());
    }

    function animateAmbient() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateAmbient);
    }
    animateAmbient();

    // Web Audio 音效合成器
    let audioCtx = null;

    function initAudio() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {
        console.log('Audio init failed:', e);
      }
    }

    function playSound(type) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(380, now);
          osc.frequency.exponentialRampToValueAtTime(90, now + 0.08);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'unlock') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.12);
          osc.frequency.setValueAtTime(783.99, now + 0.24);
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.6);
          osc.start(now);
          osc.stop(now + 0.6);
        } else if (type === 'shatter') {
          const bufferSize = audioCtx.sampleRate * 0.45;
          const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          const noise = audioCtx.createBufferSource();
          noise.buffer = buffer;
          const noiseFilter = audioCtx.createBiquadFilter();
          noiseFilter.type = 'highpass';
          noiseFilter.frequency.value = 900;
          
          noise.connect(noiseFilter);
          noiseFilter.connect(gain);
          gain.gain.setValueAtTime(0.65, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
          noise.start(now);
        } else if (type === 'eerie') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(110, now);
          osc.frequency.exponentialRampToValueAtTime(55, now + 2.2);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 2.2);
          osc.start(now);
          osc.stop(now + 2.2);
        }
      } catch (e) {
        console.log('Audio playback skipped:', e);
      }
    }

    // 遊戲狀態與密碼設定
    const digits = [0, 0, 0];
    const targetCode = [1, 5, 8]; // 1隻紅草鴞, 5個黃窗口, 8隻藍死鼠
    let isUnlocked = false;
    let isKeyCollected = false;

    function switchScene(targetId, displayType = 'block') {
      const scenes = document.querySelectorAll('.scene');
      scenes.forEach(s => {
        s.style.display = 'none';
        s.classList.remove('active');
      });

      const target = document.getElementById(targetId);
      if (target) {
        target.style.display = displayType;
        target.classList.add('active');
      }
    }

    function initGame() {
      switchScene('mainScene', 'block');
      try {
        initAudio();
        playSound('click');
      } catch(e){}
    }

    function openLockModal() {
      if (isUnlocked) return;
      try { playSound('click'); } catch(e){}
      const modal = document.getElementById('lockModal');
      if (modal) modal.style.display = 'flex';
    }

    function closeLockModal() {
      try { playSound('click'); } catch(e){}
      const modal = document.getElementById('lockModal');
      if (modal) modal.style.display = 'none';
    }

    function changeDigit(index, delta) {
      try { playSound('click'); } catch(e){}
      digits[index] = (digits[index] + delta + 10) % 10;
      document.getElementById(`digit${index}`).innerText = digits[index];
      checkLockCode();
    }

    function checkLockCode() {
      if (digits[0] === targetCode[0] && digits[1] === targetCode[1] && digits[2] === targetCode[2]) {
        isUnlocked = true;
        try { playSound('unlock'); } catch(e){}

        setTimeout(() => {
          closeLockModal();
          triggerStatueShatter();
        }, 600);
      }
    }

    function triggerStatueShatter() {
      try { playSound('shatter'); } catch(e){}
      document.getElementById('collarGlow').style.display = 'none';
      document.getElementById('dogStatueFull').style.display = 'none';
      document.getElementById('dogStatueBroken').style.display = 'block';
      document.getElementById('keyItem').style.display = 'block';
    }

    function collectKeyAndTransition() {
      if (isKeyCollected) return;
      isKeyCollected = true;
      try { playSound('click'); } catch(e){}
      document.getElementById('keyItem').style.display = 'none';

      // 切換至鏡子畫面
      switchScene('mirrorScene', 'flex');
      try { playSound('eerie'); } catch(e){}
    }

    function triggerMirrorReveal() {
      try { playSound('eerie'); } catch(e){}
      const owlSvg = document.getElementById('owlSvg');
      if (owlSvg) owlSvg.classList.add('revealed');

      document.getElementById('storyText').innerHTML = `
        鏡子裡映照出的，不是人類的模樣...<br><br>
        而是一隻帶有心形面具、眼神深邃無奈的<span class="highlight">草鴞</span>。<br>
        全台僅存約 <span class="highlight">158 對</span> 繁衍個體，你正是其中之一。
      `;

      // 顯示公視新聞連結按鈕
      document.getElementById('ptsNewsLink').style.display = 'inline-block';
    }
  </script>
